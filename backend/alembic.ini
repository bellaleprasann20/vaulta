[alembic]
# Path to migration scripts, relative to this file.
script_location = migrations

# Template used to generate migration file names.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s

# Timezone for the "created date" comment in new revision files.
timezone = UTC

# Max length for the "slug" portion of a generated filename.
truncate_slug_length = 40

# sourceless = false
# revision_environment = false

# version path separator
version_path_separator = os

# `sqlalchemy.url` is intentionally left blank — env.py overrides it at
# runtime from app.core.config.settings.DATABASE_URL, so the real
# connection string lives in exactly one place (.env), not duplicated here.
sqlalchemy.url =

[post_write_hooks]
# no-op — add black/ruff hooks here later if desired

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S